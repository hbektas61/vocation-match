# Local Supabase configuration for Vocation Match.
#
# `supabase/scripts/db-test.sh` does not need this file — it drives the same
# Postgres image directly with Docker so the database checks run without the
# Supabase CLI installed. This file is what `supabase start` / `supabase db
# reset` read once the CLI is available, and it documents the intended
# project settings either way.
#
# No key, token, or password belongs in this file. Secrets are read from the
# environment (see `mobile/.env.example`).

project_id = "vocation-match"

[api]
enabled = true
port = 54321
schemas = ["public"]          # `app` stays private: helpers must not be callable over the API.
extra_search_path = ["public", "extensions"]
max_rows = 100

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "vocationmatch://"
additional_redirect_urls = ["vocationmatch://"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
# On, everywhere, including locally.
#
# It used to be off here "for local development only", which meant every local
# run exercised a sign-up flow no real project would ever have: one that returns
# a session immediately. The client was written against that, and threw on the
# happy path of a project that confirms addresses — a hard failure on sign-up
# that no test could have caught, because no test ever ran against the real
# configuration.
#
# `scripts/verify-auth-config.js` fails the build if this is ever turned back
# off. The hosted project has its own copy of this setting, which does not
# travel with the migrations; the steps for it are in `docs/hosted-setup.md`
# (backlog S-003).
enable_confirmations = true
# Local mail goes to Inbucket rather than anywhere real.
double_confirm_changes = true
secure_password_change = true

[auth.email.template.confirmation]
subject = "Confirm your Vocation Match email"

[inbucket]
enabled = true
port = 54324

[auth.rate_limit]
# Turning confirmation on means the sign-up and resend endpoints now send mail
# to an address the caller types in. Both are public — the anon key is meant to
# ship in a client — so without a bound, a script can point them at somebody
# else's inbox and keep going. That is harassment, cheap, and needs no account.
#
# These are the local numbers. The hosted project keeps its own, which do not
# travel with this file; `docs/hosted-setup.md` says so and says what to set.
email_sent = 10
sign_in_sign_ups = 30
token_refresh = 150
token_verifications = 30

[auth.sms]
enable_signup = false

[storage]
enabled = true
file_size_limit = "5MiB"

[analytics]
enabled = false
