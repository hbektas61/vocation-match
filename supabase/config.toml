# Local Supabase configuration for Vocation Match.
#
# `supabase/scripts/db-test.sh` does not need this file — it drives the same
# Postgres image directly with Docker so the database checks run without the
# Supabase CLI installed. This file is what `supabase start` / `supabase db
# reset` read once the CLI is available, and it documents the intended
# project settings either way.
#
# No key, token, or password belongs in this file. Secrets are read from the
# environment (see `mobile/.env.example`).

project_id = "vocation-match"

[api]
enabled = true
port = 54321
schemas = ["public"]          # `app` stays private: helpers must not be callable over the API.
extra_search_path = ["public", "extensions"]
max_rows = 100

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "vocationmatch://"
additional_redirect_urls = ["vocationmatch://"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = false
enable_confirmations = false
double_confirm_changes = true
secure_password_change = true
max_frequency = "1m"
otp_length = 8
otp_expiry = 3600

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[inbucket]
enabled = false
port = 54324

[auth.rate_limit]
# SMS sending is public and costs money. Keep both the project-wide send bucket
# and per-number frequency bounded; the hosted project has its own settings.
sms_sent = 10
sign_in_sign_ups = 30
token_refresh = 150
token_verifications = 30

[auth.sms]
enable_signup = true
enable_confirmations = true
template = "Your Vocation Match code is {{ .Code }}"
max_frequency = "60s"
# Deliberately no enabled provider table here. The native app does not yet
# produce CAPTCHA tokens, so enabling Twilio/MessageBird/TextLocal/Vonage would
# expose a public, billable SMS endpoint and a trivial global-quota DoS.
# `scripts/verify-auth-config.js` rejects any enabled provider until that gate
# is implemented and verified on devices.

[storage]
enabled = true
file_size_limit = "5MiB"

[analytics]
enabled = false
